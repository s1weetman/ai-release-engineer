[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-release-engineer"
version = "0.1.0"
description = "A governed agentic AI system for planning, implementing, validating, and preparing software changes for human-approved release."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Steve Weetman" }
]
dependencies = [
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
pretty = true
show_error_codes = true
warn_unused_configs = true
